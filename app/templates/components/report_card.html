<div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col justify-between overflow-hidden group hover:-translate-y-1">
    
    <!-- Top Header & Favorite Bookmark Button -->
    <div class="p-5 space-y-3">
        <div class="flex items-start justify-between gap-3">
            
            <!-- Department Tag Badge -->
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-orange-100 dark:bg-orange-950/80 text-bicec-orange dark:text-orange-300 border border-orange-200 dark:border-orange-900">
                <span class="w-1.5 h-1.5 rounded-full bg-bicec-orange"></span>
                {{ report.department }}
            </span>

            <!-- HTMX Heart Favorite Button -->
            <button hx-post="/api/favorites/toggle/{{ report.id }}"
                    hx-target="this"
                    hx-swap="outerHTML"
                    title="{% if report.is_favorite %}Retirer des favoris{% else %}Ajouter aux favoris{% endif %}"
                    class="p-2 rounded-full hover:bg-orange-50 dark:hover:bg-gray-700 transition-colors duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" 
                     class="w-6 h-6 {% if report.is_favorite %}fill-[#E67900] text-[#E67900]{% else %}fill-none text-gray-400 hover:text-[#E67900]{% endif %} transition-all duration-300 transform hover:scale-110" 
                     viewBox="0 0 24 24" 
                     stroke="currentColor" 
                     stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
            </button>
        </div>

        <!-- Report Title -->
        <h3 class="text-base font-bold text-gray-900 dark:text-white group-hover:text-bicec-orange transition-colors leading-snug line-clamp-2">
            <a href="/reports/{{ report.id }}">
                {{ report.name }}
            </a>
        </h3>

        <!-- Report Description -->
        <p class="text-xs text-gray-600 dark:text-gray-400 line-clamp-3 leading-relaxed">
            {{ report.description or 'Tableau de bord décisionnel Power BI Report Server pour la gestion des activités BICEC.' }}
        </p>

        <!-- Tags List -->
        <div class="flex flex-wrap gap-1.5 pt-1">
            {% for tag in report.tags %}
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">
                #{{ tag.strip() }}
            </span>
            {% endfor %}
        </div>
    </div>

    <!-- Bottom Footer Actions -->
    <div class="px-5 py-3.5 bg-gray-50 dark:bg-gray-700/50 border-t border-gray-100 dark:border-gray-700 flex items-center justify-between gap-2">
        
        <!-- View Counter -->
        <div class="flex items-center gap-1.5 text-xs font-medium text-gray-500 dark:text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-bicec-orange" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <span>{{ report.view_count }}</span>
        </div>

        <div class="flex items-center gap-2">
            <!-- Details Modal Trigger -->
            <button @click="$dispatch('open-report-modal', {
                        id: {{ report.id }},
                        pbirs_id: '{{ report.pbirs_id }}',
                        name: '{{ report.name | replace("'", "\\'") }}',
                        description: '{{ (report.description or '') | replace("'", "\\'") }}',
                        department: '{{ report.department }}',
                        category: '{{ report.category }}',
                        tags: {{ report.tags | tojson }},
                        path: '{{ report.path }}',
                        view_count: {{ report.view_count }},
                        is_featured: {{ 'true' if report.is_featured else 'false' }}
                    })"
                    title="Voir les détails"
                    class="p-1.5 rounded-xl border border-gray-200 dark:border-gray-600 hover:bg-orange-50 dark:hover:bg-gray-700 text-gray-500 hover:text-bicec-orange transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </button>

            <!-- Primary Action Button -->
            <a href="/reports/{{ report.id }}" 
               class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs font-bold text-white bg-bicec-orange hover:bg-[#cf6c00] shadow-sm transition-all duration-200">
                <span>Ouvrir</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </a>
        </div>
    </div>

</div>
