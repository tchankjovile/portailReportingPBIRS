<!-- =====================================================
     BICEC PBIRS Portal — Stats & Metadata Modal Component
     Affiche les métadonnées détaillées d'un rapport Power BI
     ===================================================== -->

<div x-data="{ open: false, report: null }"
     @open-report-modal.window="open = true; report = $event.detail"
     @keydown.escape.window="open = false">

    <!-- Modal Backdrop -->
    <div x-show="open"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click.self="open = false"
         class="fixed inset-0 z-[8000] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4"
         style="display: none;">

        <!-- Modal Panel -->
        <div x-show="open"
             x-transition:enter="transition ease-out duration-250"
             x-transition:enter-start="opacity-0 scale-95 translate-y-4"
             x-transition:enter-end="opacity-100 scale-100 translate-y-0"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 scale-100"
             x-transition:leave-end="opacity-0 scale-95"
             class="bg-white dark:bg-gray-800 rounded-3xl shadow-2xl border border-gray-200 dark:border-gray-700 w-full max-w-lg overflow-hidden"
             style="display: none;">

            <!-- Modal Header: Gradient Banner -->
            <div class="bg-gradient-to-r from-bicec-chocolate to-bicec-orange p-6 relative overflow-hidden">
                <!-- Decorative circle -->
                <div class="absolute -right-8 -top-8 w-32 h-32 rounded-full bg-white/10 pointer-events-none"></div>
                <div class="absolute -right-4 top-8 w-20 h-20 rounded-full bg-white/5 pointer-events-none"></div>

                <div class="relative z-10 flex items-start justify-between gap-4">
                    <div class="space-y-1">
                        <!-- Department Badge -->
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-white/15 text-orange-200 border border-white/20"
                              x-text="report?.department || '—'"></span>
                        <!-- Report Name -->
                        <h2 class="text-xl font-heading font-extrabold text-white leading-tight"
                            x-text="report?.name || 'Rapport BICEC'"></h2>
                        <!-- Category -->
                        <p class="text-xs text-orange-200/80 font-mono"
                           x-text="report?.category || ''"></p>
                    </div>
                    <!-- Close Button -->
                    <button @click="open = false"
                            class="p-2 rounded-full bg-white/10 hover:bg-white/20 text-white transition-colors shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Modal Body -->
            <div class="p-6 space-y-5">

                <!-- Description -->
                <div class="space-y-1.5">
                    <p class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Description</p>
                    <p class="text-sm text-gray-700 dark:text-gray-300 leading-relaxed"
                       x-text="report?.description || 'Tableau de bord décisionnel Power BI Report Server BICEC.'"></p>
                </div>

                <!-- Tags -->
                <div class="space-y-2">
                    <p class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Étiquettes</p>
                    <div class="flex flex-wrap gap-1.5" x-show="report?.tags && report.tags.length > 0">
                        <template x-for="tag in (report?.tags || [])" :key="tag">
                            <span class="text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-orange-50 dark:bg-orange-950/50 text-bicec-orange border border-orange-200 dark:border-orange-900"
                                  x-text="'#' + tag.trim()"></span>
                        </template>
                    </div>
                </div>

                <!-- Stats Grid -->
                <div class="grid grid-cols-3 gap-3">
                    <!-- View Count -->
                    <div class="bg-gray-50 dark:bg-gray-700/50 rounded-2xl p-4 text-center space-y-1 border border-gray-100 dark:border-gray-700">
                        <div class="text-2xl font-black text-bicec-orange" x-text="report?.view_count || 0"></div>
                        <div class="text-[10px] font-semibold text-gray-500 dark:text-gray-400">Consultations</div>
                    </div>
                    <!-- Featured -->
                    <div class="bg-gray-50 dark:bg-gray-700/50 rounded-2xl p-4 text-center space-y-1 border border-gray-100 dark:border-gray-700">
                        <div class="text-2xl" x-text="report?.is_featured ? '⭐' : '—'"></div>
                        <div class="text-[10px] font-semibold text-gray-500 dark:text-gray-400">À la Une</div>
                    </div>
                    <!-- RLS Status -->
                    <div class="bg-gray-50 dark:bg-gray-700/50 rounded-2xl p-4 text-center space-y-1 border border-gray-100 dark:border-gray-700">
                        <div class="flex justify-center">
                            <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse mt-1.5"></span>
                        </div>
                        <div class="text-[10px] font-semibold text-gray-500 dark:text-gray-400">RLS Actif</div>
                    </div>
                </div>

                <!-- PBIRS Technical Info -->
                <div class="bg-gray-900 dark:bg-gray-950 rounded-2xl p-4 space-y-2 border border-gray-800">
                    <p class="text-[11px] font-bold uppercase tracking-wider text-amber-400">Informations Techniques PBIRS</p>
                    <div class="space-y-1.5">
                        <div class="flex items-center justify-between text-xs">
                            <span class="text-gray-400 font-mono">pbirs_id</span>
                            <span class="text-emerald-400 font-mono font-semibold" x-text="report?.pbirs_id || '—'"></span>
                        </div>
                        <div class="flex items-center justify-between text-xs">
                            <span class="text-gray-400 font-mono">path</span>
                            <span class="text-sky-400 font-mono truncate max-w-[200px]" x-text="report?.path || '—'"></span>
                        </div>
                        <div class="flex items-center justify-between text-xs">
                            <span class="text-gray-400 font-mono">embed_mode</span>
                            <span class="text-orange-300 font-mono">rs:Embed=true&amp;rc:Toolbar=false</span>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-3 pt-1">
                    <!-- Open Report -->
                    <a :href="'/reports/' + (report?.id || '')"
                       class="flex-1 flex items-center justify-center gap-2 px-4 py-3 rounded-2xl bg-bicec-orange hover:bg-bicec-orange-hover text-white text-sm font-bold shadow-lg hover:shadow-xl transition-all duration-200 hover:-translate-y-0.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                        </svg>
                        Ouvrir le Rapport
                    </a>
                    <!-- Copy Link -->
                    <button @click="copyToClipboard(window.location.origin + '/reports/' + report?.id, 'Lien du rapport copié !')"
                            class="px-4 py-3 rounded-2xl bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300 text-sm font-bold transition-colors"
                            title="Copier le lien">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>
